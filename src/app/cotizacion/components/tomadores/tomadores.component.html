<div class="main-container">

  <!-- TARJETA DEL FORMULARIO -->
  <div class="card-form">

    <div class="card-header-custom">
      <h3>👤 Gestión de Tomadores</h3>
    </div>

    <div class="card-body-custom">
      <form (ngSubmit)="guardar()">

        <!-- GRID DEL FORMULARIO -->
        <div class="form-grid">

          <!-- FILA 1 -->
          <div class="form-group col-4">
            <label>Cédula</label>
            <input
              type="number"
              (keydown)="bloquearTeclasInvalidas($event)"
              class="form-control-custom"
              [(ngModel)]="tomador.ccTomador"
              name="cctomador"
              placeholder="Ej: 12345678"
              [disabled]="editando">
          </div>

          <div class="form-group col-8">
            <label>Nombre</label>
            <input
              type="text"
              class="form-control-custom"
              [(ngModel)]="tomador.nombreTomador"
              name="nombreTomador"
              placeholder="Nombre completo">
          </div>

          <!-- FILA 2 -->
          <div class="form-group col-6">
            <label>Email</label>
            <input
              type="email"
              class="form-control-custom"
              [(ngModel)]="tomador.email"
              name="email"
              placeholder="correo@ejemplo.com">
          </div>

          <div class="form-group col-6">
            <label>Teléfono</label>
            <input
              type="number"
              (keydown)="bloquearTeclasInvalidas($event)"
              class="form-control-custom"
              [(ngModel)]="tomador.telefono"
              name="telefono"
              placeholder="Ej: 3001234567">
          </div>

          <!-- FILA 3 -->
          <div class="form-group col-4">
            <label>Fecha Nacimiento</label>
            <input
              type="date"
              class="form-control-custom"
              [(ngModel)]="tomador.fecNacimiento"
              name="fecNacimiento">
          </div>

          <div class="form-group col-4">
            <label>Ocupación</label>
            <input
              type="text"
              class="form-control-custom"
              [(ngModel)]="tomador.ocupacion"
              name="ocupacion"
              placeholder="Ej: Contador">
          </div>

          <div class="form-group col-4">
            <label>Género</label>
            <select
              class="form-control-custom"
              [(ngModel)]="tomador.genero"
              name="genero">
              <option value="">Seleccione...</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
            </select>
          </div>

          <!-- FILA 4 -->
          <div class="form-group col-8">
            <label>Dirección</label>
            <input
              type="text"
              class="form-control-custom"
              [(ngModel)]="tomador.direccion"
              name="direccion"
              placeholder="Dirección de residencia">
          </div>

          <div class="form-group col-4">
            <label>Tipo Persona</label>
            <select
              class="form-control-custom"
              [(ngModel)]="tomador.tipPersona"
              name="tipPersona">
              <option value="">Seleccione...</option>
              <option value="NATURAL">Natural</option>
              <option value="JURIDICA">Jurídica</option>
            </select>
          </div>

        </div>

        <!-- ACCIONES -->
        <div class="actions-container">
          <button type="submit" class="btn-primary-red">
            💾 {{editando ? 'Actualizar' : 'Guardar'}}
          </button>

          <button
            type="button"
            class="btn-secondary-gray"
            (click)="limpiarFormulario()">
            🆕 Nuevo
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- TARJETA DE LA TABLA -->
  <div class="card-table">
    <div class="table-responsive">
      <table class="custom-table">
        <thead>
          <tr>
            <th>CÉDULA</th>
            <th>NOMBRE</th>
            <th>GÉNERO</th>
            <th>OCUPACIÓN</th>
            <th>EMAIL</th>
            <th>TELÉFONO</th>
            <th>TIPO</th>
            <th class="text-center">ACCIONES</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tomadores">
            <td><strong>{{t.ccTomador}}</strong></td>
            <td>{{t.nombreTomador}}</td>
            <td>{{t.genero}}</td>
            <td>{{t.ocupacion}}</td>
            <td>{{t.email}}</td>
            <td>{{t.telefono}}</td>
            <td>
              <span class="badge" [ngClass]="t.tipPersona=='NATURAL' ? 'badge-natural' : 'badge-juridica'">
                {{t.tipPersona}}
              </span>
            </td>
            <td class="text-center">
              <button class="btn-tbl btn-tbl-edit" (click)="editar(t)">✏️ Editar</button>
              <button class="btn-tbl btn-tbl-delete" (click)="eliminar(t)">🗑️ Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
