<div class="container">
    <div class="card">
        <h1>Formulario de Datos de Riesgo</h1>

        <form [formGroup]="datosRiesgoForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="id">Identificación</label>
                <input type="text" id="id" formControlName="id">
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" formControlName="matricula">
            </div>

            <div class="form-group">
                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" formControlName="cedula">
            </div>

            <div class="form-group">
                <label for="estadoId">Estado</label>
                <input type="text" id="estadoId" formControlName="estadoId">
            </div>

            <div class="form-group">
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" formControlName="modelo">
            </div>

            <div class="form-group">
                <label for="servicio">Servicio</label>
                <select id="servicio" formControlName="servicio">
                    <option value="PARTICULAR">Particular</option>
                    <option value="PUBLICO">Público</option>
                </select>
            </div>

            <button type="submit" [disabled]="!datosRiesgoForm.valid">
                {{ isEditMode ? 'Actualizar' : 'Guardar' }}
            </button>

            <button type="submit" *ngIf="isEditMode" (click)="onCancel()">Cancel</button>

        </form>
    </div>
</div>
