<div class="form-panel">
    <!-- Encabezado del Formulario -->
    <div class="form-header">
        <h2>Datos de Riesgo</h2>
        <span>Vehículo</span>
    </div>

    <!-- Formulario Reactive -->
    <form [formGroup]="datosRiesgoForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="id">Identificación</label>
            <input
                type="text"
                id="id"
                formControlName="id"
                placeholder="ID de riesgo"
            />
        </div>

        <div class="form-group">
            <label for="matricula">Matrícula</label>
            <input
                type="text"
                id="matricula"
                formControlName="matricula"
                placeholder="Ej: ABC123"
            />
        </div>

        <div class="form-group">
            <label for="cedula">Cédula del Propietario</label>
            <input
                type="text"
                id="cedula"
                formControlName="cedula"
                placeholder="Número de cédula"
            />
        </div>

        <div class="form-group">
            <label for="estadoId">Estado</label>
            <input
                type="text"
                id="estadoId"
                formControlName="estadoId"
                placeholder="Estado del registro"
            />
        </div>

        <div class="form-group">
            <label for="modelo">Modelo</label>
            <input
                type="text"
                id="modelo"
                formControlName="modelo"
                placeholder="Ej: 2024"
            />
        </div>

        <div class="form-group">
            <label for="servicio">Servicio</label>
            <select id="servicio" formControlName="servicio">
                <option value="PARTICULAR">Particular</option>
                <option value="PUBLICO">Público</option>
            </select>
        </div>

        <!-- Botones de Acción -->
        <div class="buttons">
            <button
                type="submit"
                class="btn-save"
                [disabled]="!datosRiesgoForm.valid">
                Guardar
            </button>
           <button type="button" class="btn-cancel" (click)="cancelar()">
              Cancelar
          </button>
        </div>

    </form>
</div>
