<h1>Login</h1>
 
<form (ngSubmit)="login()">
  <label for="username">Usuario</label>
  <input id="username" name="username" placeholder="ej: profesor" required [(ngModel)]="username" />
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" placeholder="ej: 1234" required [(ngModel)]="password" />
  <button type="submit">Ingresar</button>
</form>
