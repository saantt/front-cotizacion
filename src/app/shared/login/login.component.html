<div class="login-page">
  <div class="login-card">
    <h1>Iniciar sesión</h1>
    <p class="login-subtitle">Ingrese sus credenciales para continuar</p>

    <form (ngSubmit)="login()" class="login-form">
      <label for="username">Usuario</label>
      <input id="username" name="username" placeholder="ej: profesor" required [(ngModel)]="username" />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="ej: 1234" required [(ngModel)]="password" />

      <button type="submit">Ingresar</button>
       <a href="/register" class="btn btn-link">Registrarse</a>
    </form>
   

    <div *ngIf="loginError" class="login-error">
      {{ loginError }}
    </div>
  </div>
</div>
